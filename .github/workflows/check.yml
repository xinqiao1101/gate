/**
 * VPN Gate SSTP 检测 Worker（自包含版，不依赖第三方限流接口）
 * 部署：Cloudflare Workers → 编辑代码 → 全选替换 → 保存并部署
 * 访问：https://你的worker/check?sstp=vpn:vpn@主机:端口
 *
 * 设计原则：
 *   1. 节点“通不通”只看 TCP 连通性（SSTP 跑在 TCP 上，Workers 只能发 HTTP(S) 请求来探活）
 *   2. IP 归属/ASN 情报改为“尽力而为”，查不到不计入失败，避免第三方接口 429 误杀全部节点
 */

export default {
  async fetch(request, env, ctx) {
    const url = new URL(request.url);

    if (url.pathname !== '/check') {
      return new Response('ok', { status: 200 });
    }

    const sstp = url.searchParams.get('sstp') || '';

    // 从 sstp=vpn:vpn@host:port 解析出 host:port
    const atIndex = sstp.lastIndexOf('@');
    if (atIndex === -1) {
      return Response.json({ success: false, error: 'invalid sstp param: missing @' }, { status: 400 });
    }
    const hostPort = sstp.slice(atIndex + 1);
    const lastColon = hostPort.lastIndexOf(':');
    if (lastColon === -1) {
      return Response.json({ success: false, error: 'invalid sstp param: missing port' }, { status: 400 });
    }
    const host = hostPort.slice(0, lastColon);
    const port = parseInt(hostPort.slice(lastColon + 1), 10);
    if (!host || !port || port < 1 || port > 65535) {
      return Response.json({ success: false, error: 'invalid host or port' }, { status: 400 });
    }

    const start = Date.now();

    // ---- 1) 连通性检测 ----
    let connected = false;
    let connErr = null;
    try {
      await fetch(`${port === 443 ? 'https' : 'http'}://${host}:${port}/`, {
        method: 'GET',
        redirect: 'manual',
        signal: AbortSignal.timeout(8000),
      });
      connected = true;
    } catch (e) {
      connErr = e.message || String(e);
      // TLS/HTTP 握手类报错通常说明端口是开的（只是不是标准 HTTP 服务），也视为可达
      const isHandshakeErr = /TLS|SSL|certificate|self signed|handshake|alert|unable to get local issuer|4\d\d|5\d\d/i.test(connErr);
      if (isHandshakeErr) connected = true;
    }
    const latency = Date.now() - start;

    if (!connected) {
      return Response.json({
        success: false,
        responseTime: latency,
        colo: request.cf?.colo || null,
        error: connErr || 'connection failed',
      });
    }

    // ---- 2) 出口 IP 情报（尽力而为，失败不计入节点可用性）----
    let exit = null;
    try {
      const doh = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(host)}&type=A`, {
        headers: { accept: 'application/dns-json' },
        signal: AbortSignal.timeout(5000),
      });
      const dohJson = await doh.json();
      const ip = dohJson?.Answer?.[0]?.data || null;
      // 不调用第三方 ASN 查询，避免 429；交给 vpngate.py 按主机名分类住宅/机房
      exit = {
        ip,
        country: null, country_code: null, city: null, continent: null,
        asn: { asn: null, org: null, type: null },
        is_datacenter: null,
      };
    } catch {
      exit = {
        ip: null, country: null, country_code: null, city: null, continent: null,
        asn: { asn: null, org: null, type: null }, is_datacenter: null,
      };
    }

    return Response.json({
      success: true,
      responseTime: latency,
      colo: request.cf?.colo || null,
      exit,
    });
  },
};
